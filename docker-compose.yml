name: cypress-hub-dev
services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: cypress_hub_dev
      POSTGRES_USER: cypress_hub
      POSTGRES_PASSWORD: cypress_hub_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "cypress_hub", "-d", "cypress_hub_dev"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  postgres_data:
